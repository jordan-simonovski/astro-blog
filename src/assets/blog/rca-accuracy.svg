<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" class="viz" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Root-cause accuracy by arm. Overall pass-rate: wide-sql 87%, bubble-up 89%, pillars 61%. Cross-surface stitching scenarios (mean of S1, S4, S5): wide-sql 70%, bubble-up 70%, pillars 17%.">
  <style>
    /* Categorical bar hues (validated); swap on the blog's dark toggle. */
    .viz { --s1: #2a78d6; --s2: #1baf7a; --s3: #eda100; }
    html[data-theme="dark"] .viz { --s1: #3987e5; --s2: #199e70; --s3: #c98500; }

    /* Chrome/ink is drawn from the site's own theme var, so it follows the
       data-theme toggle automatically. Fallback = light theme for standalone view. */
    .viz-title  { fill: rgb(var(--color-text-base, 40, 39, 40)); font-size: 19px; font-weight: 650; }
    .viz-sub    { fill: rgb(var(--color-text-base, 40, 39, 40)); fill-opacity: .62; font-size: 13px; }
    .viz-foot   { fill: rgb(var(--color-text-base, 40, 39, 40)); fill-opacity: .5;  font-size: 11.5px; }
    .viz-tick   { fill: rgb(var(--color-text-base, 40, 39, 40)); fill-opacity: .55; font-size: 12px; font-variant-numeric: tabular-nums; }
    .viz-glabel { fill: rgb(var(--color-text-base, 40, 39, 40)); fill-opacity: .78; font-size: 13px; font-weight: 550; }
    .viz-val    { fill: rgb(var(--color-text-base, 40, 39, 40)); font-size: 14px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .viz-leg    { fill: rgb(var(--color-text-base, 40, 39, 40)); fill-opacity: .78; font-size: 13px; }
    .viz-grid   { stroke: rgb(var(--color-text-base, 40, 39, 40)); stroke-opacity: .12; stroke-width: 1; }
    .viz-base   { stroke: rgb(var(--color-text-base, 40, 39, 40)); stroke-opacity: .28; stroke-width: 1.5; }
  </style>

  <text x="56" y="32" class="viz-title">Root-cause accuracy: wide events vs three pillars</text>
  <text x="56" y="54" class="viz-sub">Pass-rate over scored trials — higher is better.</text>

  <!-- gridlines -->
  <line x1="56" y1="90"  x2="700" y2="90"  class="viz-grid"/>
  <line x1="56" y1="160" x2="700" y2="160" class="viz-grid"/>
  <line x1="56" y1="230" x2="700" y2="230" class="viz-grid"/>
  <line x1="56" y1="300" x2="700" y2="300" class="viz-grid"/>
  <line x1="56" y1="370" x2="700" y2="370" class="viz-base"/>

  <!-- y ticks -->
  <text x="48" y="94"  text-anchor="end" class="viz-tick">100%</text>
  <text x="48" y="164" text-anchor="end" class="viz-tick">75%</text>
  <text x="48" y="234" text-anchor="end" class="viz-tick">50%</text>
  <text x="48" y="304" text-anchor="end" class="viz-tick">25%</text>
  <text x="48" y="374" text-anchor="end" class="viz-tick">0%</text>

  <!-- Group 1: Overall (87 / 89 / 61) -->
  <path d="M128 370 L128 130.4 Q128 126.4 132 126.4 L178 126.4 Q182 126.4 182 130.4 L182 370 Z" fill="var(--s1)"/>
  <path d="M190 370 L190 124.8 Q190 120.8 194 120.8 L240 120.8 Q244 120.8 244 124.8 L244 370 Z" fill="var(--s2)"/>
  <path d="M252 370 L252 203.2 Q252 199.2 256 199.2 L302 199.2 Q306 199.2 306 203.2 L306 370 Z" fill="var(--s3)"/>
  <text x="155" y="118" text-anchor="middle" class="viz-val">87%</text>
  <text x="217" y="113" text-anchor="middle" class="viz-val">89%</text>
  <text x="279" y="191" text-anchor="middle" class="viz-val">61%</text>

  <!-- Group 2: Cross-surface stitching (70 / 70 / 17) -->
  <path d="M450 370 L450 178 Q450 174 454 174 L500 174 Q504 174 504 178 L504 370 Z" fill="var(--s1)"/>
  <path d="M512 370 L512 178 Q512 174 516 174 L562 174 Q566 174 566 178 L566 370 Z" fill="var(--s2)"/>
  <path d="M574 370 L574 326.4 Q574 322.4 578 322.4 L624 322.4 Q628 322.4 628 326.4 L628 370 Z" fill="var(--s3)"/>
  <text x="477" y="166" text-anchor="middle" class="viz-val">70%</text>
  <text x="539" y="166" text-anchor="middle" class="viz-val">70%</text>
  <text x="601" y="314" text-anchor="middle" class="viz-val">17%</text>

  <!-- group labels -->
  <text x="217" y="393" text-anchor="middle" class="viz-glabel">Overall</text>
  <text x="539" y="393" text-anchor="middle" class="viz-glabel">Cross-surface stitching (S1 / S4 / S5)</text>

  <!-- legend -->
  <rect x="214" y="422" width="12" height="12" rx="2" fill="var(--s1)"/>
  <text x="232" y="432" class="viz-leg">wide-sql</text>
  <rect x="316" y="422" width="12" height="12" rx="2" fill="var(--s2)"/>
  <text x="334" y="432" class="viz-leg">bubble-up</text>
  <rect x="426" y="422" width="12" height="12" rx="2" fill="var(--s3)"/>
  <text x="444" y="432" class="viz-leg">pillars</text>

  <text x="56" y="466" class="viz-foot">Cross-surface group is the mean pass-rate across the three conjunction scenarios (S1, S4, S5).</text>
</svg>
